<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

#countdown{
font-size:9vw;
font-weight:bold;
text-align:center;
}

#message{
position:absolute;
font-size:8vw;
text-align:center;
opacity:0;
transition:0.6s;
padding:20px;
}

.heart{
position:fixed;
top:-10px;
color:#ff69b4;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

#photoBox{
position:absolute;
bottom:80px;
display:none;
flex-direction:column;
align-items:center;
animation:pop 0.8s ease;
}

@keyframes pop{
0%{
transform:scale(0);
opacity:0;
}
60%{
transform:scale(1.1);
}
100%{
transform:scale(1);
opacity:1;
}
}

#photo{
width:70vw;
max-width:320px;
border-radius:25px;
border:6px solid white;
box-shadow:0 0 20px #ff69b4;
cursor:pointer;
transition:0.3s;
object-fit:cover;
}

#photo:active{
transform:scale(1.05);
}

#hint{
margin-top:10px;
font-size:4vw;
opacity:0.8;
animation:blink 1.5s infinite;
}

@keyframes blink{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}

</style>
</head>

<body onclick="start()">

<div id="countdown">แตะหน้าจอเพื่อเริ่ม ❤️</div>
<div id="message"></div>

<div id="photoBox">
<img id="photo" src="photo1.jpg">
<div id="hint">อิอิ กดๆ</div>
</div>

<audio id="music">
<source src="song.mp3" type="audio/mpeg">
</audio>

<script>

let started=false
let countdown=document.getElementById("countdown")
let message=document.getElementById("message")
let music=document.getElementById("music")

let texts=[
"Happy",
"birthday",
"to",
"มอมอ",
"24แล้วนะ",
"ขอให้ทุกวัน",
"หลังจากนี้",
"เป็นวันที่ดี",
"สำหรับเธอน้าา🥰"
]

let i=0

function start(){

if(started) return
started=true

let count=5
countdown.innerText=count

let timer=setInterval(()=>{

count--
countdown.innerText=count

if(count==0){

clearInterval(timer)
countdown.style.display="none"

startHearts()

music.volume = 0.5
music.play()

showText()

}

},1000)

}

function startHearts(){

setInterval(()=>{

let heart=document.createElement("div")
heart.classList.add("heart")
heart.innerHTML="❤"

heart.style.left=Math.random()*100+"vw"
heart.style.animationDuration=(Math.random()*3+2)+"s"

document.body.appendChild(heart)

setTimeout(()=>{heart.remove()},5000)

},200)

}

function showText(){

message.style.opacity=1

let textTimer=setInterval(()=>{

message.innerText=texts[i]

i++

if(i>=texts.length){

clearInterval(textTimer)

setTimeout(()=>{
showPhoto()
},2000)

}

},2000)

}

function showPhoto(){

message.style.display="none"

document.getElementById("photoBox").style.display="flex"

}

let photos=[
"photo1.jpg",
"photo2.png",
"photo3.jpg"
]

let p=0

document.getElementById("photo").onclick=function(){

p++

if(p>=photos.length){
p=0
}

this.src=photos[p]

}

</script>

</body>
</html>
